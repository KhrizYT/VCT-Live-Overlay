<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VALORANT Live Overlay</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#131720;--line:#2a3140;--text:#f5f7fb;--muted:#929bad;--accent:#ff4655}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#141b27,#0b0d12 52%);font:15px/1.5 Inter,system-ui,sans-serif;color:var(--text)}
main{width:min(720px,92vw);padding:34px}.hero{background:rgba(19,23,32,.94);border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
h1{font-size:37px;letter-spacing:-.05em;margin:0 0 8px}.accent{color:var(--accent)}p{color:var(--muted);margin:0 0 22px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.feature{padding:12px;border:1px solid var(--line);background:#10141c;border-radius:13px;font-size:13px}.feature b{display:block;color:#fff;margin-bottom:3px}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}input{width:100%;border:1px solid var(--line);background:#0c1017;color:#fff;border-radius:11px;padding:12px;font:inherit}button{width:100%;margin-top:10px;border:0;border-radius:11px;background:var(--accent);color:#fff;font:800 15px inherit;padding:13px;cursor:pointer}.status{min-height:20px;color:#ff9da5;font-size:12px;margin-top:8px}@media(max-width:650px){.features{grid-template-columns:1fr}h1{font-size:31px}}
</style></head><body><main><div class="hero">
<h1>VALORANT Live <span class="accent">Overlay</span></h1>
<p>Crea tu overlay en la nube. No necesitas instalar Node, abrir CMD ni ejecutar nada en la PC donde usas OBS.</p>
<div class="features"><div class="feature"><b>Automático</b>Rondas, mapas y próxima match.</div><div class="feature"><b>Compartible</b>Cada overlay tiene su propia URL.</div><div class="feature"><b>OBS</b>Solo pega el Browser Source.</div></div>
<label for="name">Nombre del overlay</label><input id="name" maxlength="60" placeholder="Ej. Co-stream Khriz"><button id="create">Crear overlay</button><div class="status" id="status"></div>
</div></main><script>
const btn=document.querySelector('#create'),status=document.querySelector('#status'),name=document.querySelector('#name');
btn.onclick=async()=>{btn.disabled=true;status.textContent='Creando…';try{const r=await fetch('/api/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value||'My Overlay'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo crear');location.href=d.room.adminUrl}catch(e){status.textContent=e.message;btn.disabled=false}};
name.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click()});
</script></body></html>
