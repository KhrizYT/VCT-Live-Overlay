<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALORANT Live Overlay v4.1.2</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
  body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
  html.preview-mode,html.preview-mode body{
    background:
      repeating-conic-gradient(#1a1f29 0 25%,#11151d 0 50%) 50%/20px 20px !important;
  }
  .stage{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0;
    pointer-events:none;
  }
  .wrap{
    position:relative;
    isolation:isolate;
    width:min(420px,calc(100vw - 56px));
    --event-accent:#5fd5e8;
    --event-accent-rgb:95,213,232;
    --overlay-opacity:.92;
    --glow-main:.95;
    --glow-secondary:.90;
    --glow-wave:.95;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.26));
  }

  /* Exterior event glow */
  .outer-glow,
  .outer-glow-2,
  .outer-wave{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:-2;
    border-radius:22px;
  }
  .outer-glow{
    inset:-10px;
    background:radial-gradient(circle at 50% 50%, rgba(var(--event-accent-rgb),.22) 0%, rgba(var(--event-accent-rgb),.16) 28%, rgba(var(--event-accent-rgb),.06) 54%, rgba(var(--event-accent-rgb),0) 76%);
    filter:blur(18px);
    opacity:var(--glow-main);
    animation:pulseGlow 4.2s ease-in-out infinite;
  }
  .outer-glow-2{
    inset:-16px -12px;
    background:
      radial-gradient(circle at 18% 56%, rgba(var(--event-accent-rgb),.36) 0%, rgba(var(--event-accent-rgb),.18) 22%, rgba(var(--event-accent-rgb),0) 52%),
      radial-gradient(circle at 84% 44%, rgba(var(--event-accent-rgb),.28) 0%, rgba(var(--event-accent-rgb),.12) 24%, rgba(var(--event-accent-rgb),0) 56%);
    filter:blur(24px);
    opacity:var(--glow-secondary);
    animation:driftGlow 7.5s ease-in-out infinite alternate;
  }
  .outer-wave{
    inset:-4px;
    border-radius:20px;
    overflow:hidden;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    -webkit-mask-composite: xor;
    padding:1.5px;
    opacity:var(--glow-wave);
  }
  .outer-wave::before{
    content:"";
    position:absolute; inset:-34%;
    background:
      conic-gradient(from 0deg,
        rgba(var(--event-accent-rgb),0) 0deg,
        rgba(var(--event-accent-rgb),0) 56deg,
        rgba(var(--event-accent-rgb),.95) 84deg,
        rgba(var(--event-accent-rgb),.18) 120deg,
        rgba(var(--event-accent-rgb),0) 160deg,
        rgba(var(--event-accent-rgb),0) 240deg,
        rgba(var(--event-accent-rgb),.65) 284deg,
        rgba(var(--event-accent-rgb),0) 320deg,
        rgba(var(--event-accent-rgb),0) 360deg);
    animation:spinWave 8.8s linear infinite;
    filter:blur(1px);
  }

  .meta{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;
    padding:6px 10px 5px;
    background:rgba(9,12,16,var(--overlay-opacity));
    border:1px solid rgba(255,255,255,.10);
    border-bottom:0;
    border-radius:16px 16px 0 0;
    box-shadow:
      inset 0 0 0 1px rgba(var(--event-accent-rgb),.16),
      0 0 0 1px rgba(var(--event-accent-rgb),.16),
      0 0 18px rgba(var(--event-accent-rgb),.18);
    font-size:9px;text-transform:uppercase;letter-spacing:.12em;
    backdrop-filter:blur(12px);
  }
  .live{display:flex;align-items:center;gap:6px;color:#ff9aa3;font-weight:900}
  .dot{width:6px;height:6px;border-radius:50%;background:#ff4655;box-shadow:0 0 10px #ff4655}
  .evt,.stg{max-width:116px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .evt{color:rgba(255,255,255,.97)}
  .stg{color:rgba(255,255,255,.72)}
  .sep{color:rgba(255,255,255,.24)}

  .main{
    position:relative;
    display:block;
    min-height:72px;
    background:rgba(8,10,14,var(--overlay-opacity));
    border:1px solid rgba(255,255,255,.12);
    border-top:0;
    border-radius:0 0 16px 16px;
    overflow:hidden;
    backdrop-filter:blur(12px);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.02),
      inset 0 1px 0 rgba(var(--event-accent-rgb),.16),
      0 0 0 1px rgba(var(--event-accent-rgb),.14),
      0 0 24px rgba(var(--event-accent-rgb),.12);
  }
  .main::before{
    content:"";
    position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg, transparent, rgba(var(--event-accent-rgb),.96), transparent);
    opacity:.95;
  }

  .scoreboard{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:1fr 84px 1fr;
    width:100%;
    min-height:72px;
    grid-column:1 / -1;
    transition:transform .34s ease, opacity .34s ease, filter .34s ease;
  }
  .main.announce-active .scoreboard{
    opacity:.10;
    transform:scale(.96);
    filter:blur(2px);
  }

  .team{
    position:relative;
    display:grid;
    align-items:center;
    min-width:0;
    --team-color:#ff4655;
    min-height:72px;
  }
  .team.left{grid-template-columns:auto 30px 1fr}
  .team.right{grid-template-columns:1fr 30px auto}
  .team::before{
    content:"";position:absolute;inset:0;opacity:.11;
    background:linear-gradient(90deg,var(--team-color),transparent 74%);
  }
  .team.right::before{background:linear-gradient(270deg,var(--team-color),transparent 74%)}
  .accent{
    position:absolute;top:0;bottom:0;width:4px;background:var(--team-color);
    box-shadow:0 0 12px color-mix(in srgb, var(--team-color) 58%, transparent);
  }
  .team.left .accent{left:0}
  .team.right .accent{right:0}

  .identity{
    position:relative;z-index:1;min-width:0;
    padding:0 4px 0 14px;
  }
  .team.right .identity{
    text-align:right;
    padding:0 14px 0 4px;
  }
  .code{
    font-size:24px;font-weight:950;letter-spacing:-.05em;line-height:1;
    text-shadow:0 1px 0 rgba(0,0,0,.35);
  }

  .logo{
    position:relative;z-index:1;
    width:34px;height:34px;display:grid;place-items:center;
    margin-inline:auto;
  }
  .logo img{
    max-width:32px;max-height:32px;object-fit:contain;
    filter:drop-shadow(0 0 8px rgba(255,255,255,.05));
  }
  .fallback{
    width:32px;height:32px;display:grid;place-items:center;
    border:1px solid rgba(255,255,255,.18);border-radius:10px;
    font-weight:950;font-size:11px;background:rgba(255,255,255,.06)
  }

  .series{
    position:relative;z-index:1;
    font-size:30px;font-weight:950;font-variant-numeric:tabular-nums;
    text-align:center; min-width:26px;
  }
  .team.left .series{padding-right:10px}
  .team.right .series{padding-left:10px}

  .center{
    position:relative;
    height:100%;
    display:grid;place-items:center;text-align:center;
    border-left:1px solid rgba(var(--event-accent-rgb),.16);
    border-right:1px solid rgba(var(--event-accent-rgb),.16);
    background:
      linear-gradient(180deg, rgba(var(--event-accent-rgb),.05), rgba(255,255,255,.015) 44%, rgba(255,255,255,.02));
    overflow:hidden;
  }
  .rounds{
    position:relative;
    z-index:2;
    display:flex;align-items:baseline;justify-content:center;gap:7px;
    font-size:20px;font-weight:950;font-variant-numeric:tabular-nums;line-height:1
  }
  .round-number{
    display:inline-block;
    min-width:14px;
    transition:text-shadow .18s ease, transform .18s ease;
  }
  .round-number.pulse{
    animation:roundDigitPulse .95s cubic-bezier(.2,.9,.2,1);
  }
  .round-number.leftwin{
    text-shadow:0 0 12px rgba(255,255,255,.26);
  }
  .round-number.rightwin{
    text-shadow:0 0 12px rgba(255,255,255,.26);
  }
  .dash{color:rgba(255,255,255,.28);font-size:12px}
  .map{
    position:relative;
    z-index:2;
    margin-top:4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    min-width:78px;
  }
  .map-label{
    font-size:8px;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:rgba(255,255,255,.65);
    line-height:1;
  }
  .map-name{
    max-width:82px;
    font-size:9.5px;
    font-weight:900;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:rgba(255,255,255,.94);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    line-height:1.05;
  }

  .round-wave{
    position:absolute;
    top:0; bottom:0;
    width:0;
    opacity:0;
    pointer-events:none;
    z-index:1;
  }
  .round-wave.left{
    left:0;
    background:linear-gradient(90deg, var(--team1-color, #ff4655) 0%, rgba(255,255,255,.18) 38%, rgba(255,255,255,0) 72%);
  }
  .round-wave.right{
    right:0;
    background:linear-gradient(270deg, var(--team2-color, #5cc8ff) 0%, rgba(255,255,255,.18) 38%, rgba(255,255,255,0) 72%);
  }
  .round-wave.left.run{animation:roundWaveLeft .95s ease-out forwards}
  .round-wave.right.run{animation:roundWaveRight .95s ease-out forwards}

  /* MAP / SERIES ANNOUNCEMENT */
  .announce{
    position:absolute;
    inset:0;
    z-index:5;
    display:grid;
    align-items:center;
    width:100%;
    height:100%;
    grid-column:1 / -1;
    opacity:0;
    pointer-events:none;
    transform:scale(.96);
    transition:opacity .22s ease, transform .22s ease;
  }
  .main.announce-active .announce{
    opacity:1;
    transform:scale(1);
  }

  .announce-card{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:0 20px;
    background:
      linear-gradient(90deg,
        color-mix(in srgb, var(--announce-color, #ff4655) 34%, rgba(10,12,17,.96)) 0%,
        rgba(8,10,14,.97) 34%,
        rgba(8,10,14,.97) 66%,
        color-mix(in srgb, var(--announce-color, #ff4655) 34%, rgba(10,12,17,.96)) 100%);
    box-shadow:
      inset 0 0 24px color-mix(in srgb, var(--announce-color, #ff4655) 16%, transparent),
      0 0 26px color-mix(in srgb, var(--announce-color, #ff4655) 26%, transparent);
  }
  .announce-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--announce-color, #ff4655) 22%, transparent) 0%, transparent 70%);
    animation:announceGlow 1.6s ease-in-out infinite;
  }
  .announce-card::after{
    content:"";
    position:absolute;
    left:-24%;
    top:0;
    width:34%;
    height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
    transform:skewX(-18deg);
    animation:announceSweep 1.3s ease-out;
  }

  .announce-id{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .announce-logo{
    width:40px;height:40px;display:grid;place-items:center;
  }
  .announce-logo img{max-width:38px;max-height:38px;object-fit:contain}
  .announce-logo .fallback{width:38px;height:38px;font-size:12px}
  .announce-code{
    font-size:30px;
    font-weight:950;
    letter-spacing:-.05em;
    line-height:1;
    text-shadow:0 0 16px color-mix(in srgb, var(--announce-color, #ff4655) 34%, transparent);
  }
  .announce-text{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    gap:2px;
    text-align:left;
  }
  .announce-title{
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(255,255,255,.82);
    font-weight:800;
  }
  .announce-sub{
    font-size:19px;
    font-weight:950;
    letter-spacing:-.03em;
  }
  .announce-sub b{
    color:color-mix(in srgb, var(--announce-color, #ff4655) 68%, white 32%);
  }

  .waiting{
    display:none;margin:auto;padding:10px 14px;background:rgba(8,10,14,.92);
    border:1px solid rgba(255,255,255,.12);border-radius:12px;
    color:rgba(255,255,255,.72);font-size:12px;letter-spacing:.08em;text-transform:uppercase
  }

  .live.upcoming{
    color:rgba(255,255,255,.88);
  }
  .live.upcoming .dot{
    background:var(--event-accent);
    box-shadow:0 0 10px rgba(var(--event-accent-rgb),.95);
  }
  .main.upcoming-mode .series{
    display:none;
  }
  .main.upcoming-mode .team.left{
    grid-template-columns:auto 34px;
    justify-content:center;
    column-gap:7px;
  }
  .main.upcoming-mode .team.right{
    grid-template-columns:34px auto;
    justify-content:center;
    column-gap:7px;
  }
  .upcoming-center{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    min-height:72px;
  }
  .upcoming-kicker{
    font-size:7.5px;
    font-weight:800;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:rgba(255,255,255,.58);
    line-height:1;
  }
  .upcoming-time{
    font-size:20px;
    font-weight:950;
    letter-spacing:-.045em;
    line-height:1;
    white-space:nowrap;
    text-shadow:0 0 14px rgba(var(--event-accent-rgb),.24);
  }

  @keyframes pulseGlow{
    0%,100%{opacity:calc(var(--glow-main) * .92); transform:scale(.995)}
    50%{opacity:var(--glow-main); transform:scale(1.015)}
  }
  @keyframes driftGlow{
    0%{transform:translateX(-6px) translateY(0px)}
    100%{transform:translateX(8px) translateY(-1px)}
  }
  @keyframes spinWave{
    0%{transform:rotate(0deg)}
    100%{transform:rotate(360deg)}
  }
  @keyframes roundDigitPulse{
    0%{transform:scale(1); text-shadow:0 0 0 transparent}
    25%{transform:scale(1.18); text-shadow:0 0 10px rgba(255,255,255,.65)}
    100%{transform:scale(1); text-shadow:0 0 0 transparent}
  }
  @keyframes roundWaveLeft{
    0%{width:0; opacity:.72}
    28%{width:64%; opacity:.88}
    100%{width:84%; opacity:0}
  }
  @keyframes roundWaveRight{
    0%{width:0; opacity:.72}
    28%{width:64%; opacity:.88}
    100%{width:84%; opacity:0}
  }
  @keyframes announceGlow{
    0%,100%{opacity:.74}
    50%{opacity:1}
  }
  @keyframes announceSweep{
    0%{transform:translateX(0) skewX(-18deg); opacity:0}
    20%{opacity:.85}
    100%{transform:translateX(480px) skewX(-18deg); opacity:0}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="wrap" id="overlay" hidden>
    <div class="outer-glow" aria-hidden="true"></div>
    <div class="outer-glow-2" aria-hidden="true"></div>
    <div class="outer-wave" aria-hidden="true"></div>

    <div class="meta">
      <span class="live" id="statusBadge"><span class="dot"></span><span id="statusBadgeText">LIVE</span></span>
      <span class="sep">•</span>
      <span class="evt" id="event">Pacific</span>
      <span class="sep">•</span>
      <span class="stg" id="stageName">Playoffs</span>
      <span class="sep" id="boSep">•</span>
      <span class="stg" id="bestOf">BO3</span>
    </div>

    <div class="main" id="main">
      <div class="scoreboard">
        <section class="team left" id="team1">
          <span class="accent"></span>
          <div class="identity"><div class="code" id="code1">PRX</div></div>
          <div class="logo" id="logo1"></div>
          <div class="series" id="series1">0</div>
        </section>

        <section class="center" id="center">
          <span class="round-wave left" id="roundWaveLeft"></span>
          <span class="round-wave right" id="roundWaveRight"></span>
          <div id="liveCenter">
            <div class="rounds" id="roundWrap">
              <span id="round1" class="round-number">0</span><span class="dash">—</span><span id="round2" class="round-number">0</span>
            </div>
            <div class="map"><div class="map-label" id="mapLabel">MAP 1</div><div class="map-name" id="mapName">HAVEN</div></div>
          </div>
          <div class="upcoming-center" id="upcomingCenter" hidden>
            <div class="upcoming-kicker">STARTS IN</div>
            <div class="upcoming-time" id="upcomingTime">—</div>
          </div>
        </section>

        <section class="team right" id="team2">
          <span class="accent"></span>
          <div class="series" id="series2">0</div>
          <div class="logo" id="logo2"></div>
          <div class="identity"><div class="code" id="code2">NS</div></div>
        </section>
      </div>

      <div class="announce" id="announce">
        <div class="announce-card" id="announceCard">
          <div class="announce-id">
            <div class="announce-logo" id="announceLogo"></div>
            <div class="announce-code" id="announceCode">PRX</div>
          </div>
          <div class="announce-text">
            <div class="announce-title" id="announceTitle">Map Winner</div>
            <div class="announce-sub" id="announceSub">Won <b>Map 1</b></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="waiting" id="waiting">Sin matches live o próximas…</div>
</div>

<script>
const el = id => document.getElementById(id);

// Admin preview only: show a checkerboard INSIDE the iframe so transparent
// pixels are visible. This query is never used for the OBS Browser Source.
if (new URLSearchParams(location.search).get("preview") === "1") {
  document.documentElement.classList.add("preview-mode");
}

// Hosted mode: obtain the room id from /overlay/ROOM-ID.
// v4.0.1 referenced `roomId` below without declaring it, which made
// the Browser Source stop before the first fetch and left the preview blank.
const pathParts = location.pathname.split("/").filter(Boolean);
const roomId = pathParts[0] === "overlay" ? pathParts[1] : null;

let previous = null;
const accentCache = new Map();

const ROUND_WAVE_MS = 1000;
const MAP_ANNOUNCE_MS = 4200;
const SERIES_ANNOUNCE_MS = 5200;

let announceTimer = null;

function shortText(v, max=20) {
  v = String(v || "");
  return v.length > max ? v.slice(0, max - 1) + "…" : v;
}
function logoHtml(team) {
  const raw = String(team.logo || "").trim();
  if (raw) {
    const src = raw.startsWith("data:")
      ? raw
      : `/api/image-proxy?url=${encodeURIComponent(raw)}`;
    return `<img src="${src.replace(/"/g,"&quot;")}" alt="" referrerpolicy="no-referrer">`;
  }
  return `<div class="fallback">${team.code}</div>`;
}
function simplifyEvent(text) {
  const t = String(text || "");
  if (t.toLowerCase().includes("game changers")) return "Game Changers";
  if (t.toLowerCase().includes("champions")) return "Champions";
  if (t.toLowerCase().includes("masters")) return "Masters";
  if (t.includes(":")) {
    const after = t.split(":").pop().trim();
    if (/ace/i.test(after)) return "ACE League";
    if (/pacific/i.test(after)) return "Pacific";
    if (/americas/i.test(after)) return "Americas";
    if (/emea/i.test(after)) return "EMEA";
    if (/china/i.test(after)) return "China";
    if (/challengers|vcl/i.test(after)) return "Challengers";
    return shortText(after, 16);
  }
  return shortText(t, 16);
}
function simplifyStage(text) {
  const t = String(text || "").toLowerCase();
  if (!t) return "Live";
  if (t.includes("playoff")) return "Playoffs";
  if (t.includes("group")) return "Groups";
  if (t.includes("main event")) return "Main Event";
  if (t.includes("upper")) return "Upper";
  if (t.includes("lower")) return "Lower";
  if (t.includes("grand final")) return "Grand Final";
  if (t.includes("final")) return "Final";
  return shortText(String(text || ""), 14);
}

function splitMapDisplay(value) {
  const raw = String(value || "").trim();
  const parts = raw.split("·").map(x => x.trim()).filter(Boolean);
  let label = "";
  let name = "";

  for (const part of parts) {
    const m = part.match(/^map\s*(\d+)$/i);
    if (m) label = `MAP ${m[1]}`;
    else if (!name && !/^(live map|series live)$/i.test(part)) name = part.toUpperCase();
  }

  if (!label) {
    const m = raw.match(/map\s*(\d+)/i);
    if (m) label = `MAP ${m[1]}`;
  }

  return { label: label || "LIVE MAP", name: shortText(name, 12) };
}

function runRoundAnimation(side) {
  const wave = side === "left" ? el("roundWaveLeft") : el("roundWaveRight");
  const digit = side === "left" ? el("round1") : el("round2");

  wave.classList.remove("run");
  digit.classList.remove("pulse", "leftwin", "rightwin");
  void wave.offsetWidth;

  if (side === "left") digit.classList.add("leftwin");
  else digit.classList.add("rightwin");

  wave.classList.add("run");
  digit.classList.add("pulse");

  setTimeout(() => {
    digit.classList.remove("leftwin", "rightwin");
  }, ROUND_WAVE_MS);
}

function showAnnouncement(team, title, subHtml, durationMs) {
  const main = el("main");
  const card = el("announceCard");

  card.style.setProperty("--announce-color", team.color || "#ff4655");
  el("announceLogo").innerHTML = logoHtml(team);
  el("announceCode").textContent = team.code;
  el("announceTitle").textContent = title;
  el("announceSub").innerHTML = subHtml;

  clearTimeout(announceTimer);
  main.classList.remove("announce-active");
  void main.offsetWidth;
  main.classList.add("announce-active");

  announceTimer = setTimeout(() => {
    main.classList.remove("announce-active");
    announceTimer = null;
  }, durationMs);
}

function hideAnnouncement() {
  clearTimeout(announceTimer);
  announceTimer = null;
  el("main").classList.remove("announce-active");
}

function rgbStringToParts(color) {
  const m = String(color).match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/i);
  if (!m) return "95,213,232";
  return `${m[1]},${m[2]},${m[3]}`;
}
function applyGlowStrength(value01) {
  const v = Math.max(0, Math.min(1.6, Number(value01 || .82)));
  const overlay = el("overlay");
  overlay.style.setProperty("--glow-main", (0.18 + v * 0.95).toFixed(3));
  overlay.style.setProperty("--glow-secondary", (0.10 + v * 0.85).toFixed(3));
  overlay.style.setProperty("--glow-wave", (0.08 + v * 0.92).toFixed(3));
}
function setAccent(color) {
  const overlay = el("overlay");
  overlay.style.setProperty("--event-accent", color);
  overlay.style.setProperty("--event-accent-rgb", rgbStringToParts(color));
}
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
async function extractAccentFromImage(url) {
  if (!url) throw new Error("No image");
  if (accentCache.has(url)) return accentCache.get(url);

  const proxyUrl = url.startsWith("data:")
    ? url
    : `/api/image-proxy?url=${encodeURIComponent(url)}`;

  const img = await loadImage(proxyUrl);
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  canvas.width = 30;
  canvas.height = 30;
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height);

  let best = null;
  for (let i = 0; i < data.length; i += 4) {
    const a = data[i + 3];
    if (a < 100) continue;
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const sat = max === 0 ? 0 : (max - min) / max;
    const lum = (r + g + b) / 3;
    if (lum < 35 || lum > 240) continue;
    const score = sat * 2.2 + (lum / 255) * 0.12 + (max / 255) * 0.3;
    if (!best || score > best.score) best = { r, g, b, score };
  }

  const color = best ? `rgb(${best.r}, ${best.g}, ${best.b})` : "rgb(95, 213, 232)";
  accentCache.set(url, color);
  return color;
}
async function applyEventAccent(s) {
  const opacity = Number(s?.ui?.backgroundOpacity ?? .92);
  el("overlay").style.setProperty("--overlay-opacity", opacity.toFixed(2));
  applyGlowStrength(s?.ui?.glowIntensity ?? .82);

  if (s?.eventLogo) {
    try {
      const color = await extractAccentFromImage(s.eventLogo);
      setAccent(color);
      return;
    } catch {}
  }
  setAccent("rgb(95, 213, 232)");
}

function seriesTarget(bestOf) {
  const bo = Number(bestOf);
  if (!Number.isFinite(bo) || bo <= 0) return 2;
  return Math.ceil(bo / 2);
}

let countdownTimer = null;
let countdownState = null;

function formatCountdown(totalSeconds, fallback="") {
  if (!Number.isFinite(totalSeconds)) return fallback || "SOON";
  const secs = Math.max(0, Math.floor(totalSeconds));

  const days = Math.floor(secs / 86400);
  const hours = Math.floor((secs % 86400) / 3600);
  const minutes = Math.floor((secs % 3600) / 60);

  if (days > 0) return `${days}d ${hours}h`;
  if (hours > 0) return `${hours}h ${minutes}m`;
  if (minutes > 0) return `${minutes}m`;
  return "<1m";
}

function stopCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = null;
  countdownState = null;
}

function startCountdown(s) {
  stopCountdown();

  const rawEta = s.etaSeconds;
  const parsedEta = (rawEta === null || rawEta === undefined || rawEta === "")
    ? NaN
    : Number(rawEta);

  countdownState = {
    etaSeconds: parsedEta,
    capturedAt: Number(s.etaCapturedAt || Date.now()),
    fallback: String(s.etaText || "")
  };

  const tick = () => {
    if (!countdownState) return;
    const elapsed = Math.max(0, (Date.now() - countdownState.capturedAt) / 1000);
    const remaining = Number.isFinite(countdownState.etaSeconds)
      ? countdownState.etaSeconds - elapsed
      : NaN;
    el("upcomingTime").textContent = formatCountdown(remaining, countdownState.fallback);
  };

  tick();
  countdownTimer = setInterval(tick, 1000);
}

async function render(s) {
  if (!s || !s.team1 || s.status === "waiting") {
    stopCountdown();
    el("overlay").hidden = true;
    el("waiting").style.display = "block";
    previous = s;
    return;
  }

  el("waiting").style.display = "none";
  el("overlay").hidden = false;

  applyEventAccent(s);

  const isUpcoming = s.status === "upcoming";
  el("main").classList.toggle("upcoming-mode", isUpcoming);
  el("statusBadge").classList.toggle("upcoming", isUpcoming);
  el("statusBadgeText").textContent = isUpcoming ? "NEXT" : "LIVE";
  el("liveCenter").hidden = isUpcoming;
  el("upcomingCenter").hidden = !isUpcoming;

  if (isUpcoming) {
    el("team1").style.setProperty("--team-color", s.team1.color || "#ff4655");
    el("team2").style.setProperty("--team-color", s.team2.color || "#5cc8ff");

    el("logo1").innerHTML = logoHtml(s.team1);
    el("logo2").innerHTML = logoHtml(s.team2);
    el("code1").textContent = s.team1.code;
    el("code2").textContent = s.team2.code;

    el("event").textContent = simplifyEvent(s.event || "Valorant");
    el("stageName").textContent = simplifyStage(s.stage || "Upcoming");
    el("bestOf").textContent = s.bestOf ? `BO${s.bestOf}` : "";
    el("boSep").style.display = s.bestOf ? "" : "none";

    startCountdown(s);
    hideAnnouncement();
    previous = JSON.parse(JSON.stringify(s));
    return;
  }

  stopCountdown();

  el("team1").style.setProperty("--team-color", s.team1.color || "#ff4655");
  el("team2").style.setProperty("--team-color", s.team2.color || "#5cc8ff");
  el("center").style.setProperty("--team1-color", s.team1.color || "#ff4655");
  el("center").style.setProperty("--team2-color", s.team2.color || "#5cc8ff");

  el("logo1").innerHTML = logoHtml(s.team1);
  el("logo2").innerHTML = logoHtml(s.team2);
  el("code1").textContent = s.team1.code;
  el("code2").textContent = s.team2.code;
  el("series1").textContent = s.team1.series ?? 0;
  el("series2").textContent = s.team2.series ?? 0;

  const hasRounds = s.team1.rounds !== null && s.team2.rounds !== null;
  el("roundWrap").style.visibility = hasRounds ? "visible" : "hidden";
  el("round1").textContent = hasRounds ? s.team1.rounds : "0";
  el("round2").textContent = hasRounds ? s.team2.rounds : "0";
  const mapInfo = splitMapDisplay(s.mapName || "Live Map");
  el("mapLabel").textContent = mapInfo.label;
  el("mapName").textContent = mapInfo.name;
  el("event").textContent = simplifyEvent(s.event || "Valorant");
  el("stageName").textContent = simplifyStage(s.stage || "Live");
  el("bestOf").textContent = s.bestOf ? `BO${s.bestOf}` : "";
  el("boSep").style.display = s.bestOf ? "" : "none";

  if (previous?.matchId === s.matchId && previous?.status !== "upcoming") {
    const t1MapChanged = previous.team1?.series !== s.team1.series;
    const t2MapChanged = previous.team2?.series !== s.team2.series;
    const t1RoundChanged = previous.team1?.rounds !== s.team1.rounds;
    const t2RoundChanged = previous.team2?.rounds !== s.team2.rounds;

    if (t1MapChanged || t2MapChanged) {
      const winner = t1MapChanged ? s.team1 : s.team2;
      const mapIndex = Number(s.team1.series ?? 0) + Number(s.team2.series ?? 0);
      const wonSeries = (Number(t1MapChanged ? s.team1.series : s.team2.series) >= seriesTarget(s.bestOf));

      if (wonSeries) {
        showAnnouncement(
          winner,
          "Series Winner",
          `Won <b>the Series</b>`,
          SERIES_ANNOUNCE_MS
        );
      } else {
        showAnnouncement(
          winner,
          "Map Winner",
          `Won <b>Map ${mapIndex || 1}</b>`,
          MAP_ANNOUNCE_MS
        );
      }
    } else {
      if (t1RoundChanged) runRoundAnimation("left");
      if (t2RoundChanged) runRoundAnimation("right");
    }
  } else if (previous?.matchId && previous.matchId !== s.matchId) {
    hideAnnouncement();
  }

  previous = JSON.parse(JSON.stringify(s));
}
if (!roomId) {
  el("overlay").hidden = true;
  el("waiting").style.display = "block";
  el("waiting").textContent = "ROOM ID NO ENCONTRADO";
} else {
  fetch(`/api/rooms/${roomId}/state`)
    .then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    })
    .then(render)
    .catch(err => {
      console.error("[overlay] initial state failed:", err);
      el("overlay").hidden = true;
      el("waiting").style.display = "block";
      el("waiting").textContent = "NO SE PUDO CARGAR EL OVERLAY";
    });

  const events = new EventSource(`/events/${roomId}`);
  events.addEventListener("state", e => {
    try { render(JSON.parse(e.data)); }
    catch (err) { console.error("[overlay] state parse failed:", err); }
  });
}
</script>
</body>
